# Jaeger v2.17 (all-in-one) with Badger — OTLP gRPC :4317, HTTP :4318, UI :16686.
# Self-contained; traces survive container restarts.

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs:
      level: INFO

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: badger_main

  jaeger_storage:
    backends:
      badger_main:
        badger:
          ephemeral: false
          directories:
            keys: /badger/keys
            values: /badger/values
          ttl:
            spans: 168h

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_main
