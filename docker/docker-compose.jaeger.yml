# Local Jaeger for OpenTelemetry (OTLP). No other repositories required.
# From repository root: make jaeger-up
# UI: http://localhost:16686  |  OTLP HTTP: http://localhost:4318

services:
  jaeger:
    image: docker.io/jaegertracing/jaeger:2.17.0
    container_name: fastapi-template-jaeger
    user: "0:0"
    restart: unless-stopped
    command:
      - --config=/etc/jaeger/jaeger-config.yaml
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/jaeger-config.yaml:ro
      - jaeger-badger-data:/badger
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # Web UI

volumes:
  jaeger-badger-data:
    driver: local
