[project]
name = "strategic-navigator-backend"
version = "1.0.0"
description = "Strategic Navigator backend for Severstal contour"
authors = [
    {name = "Mikhail Gerasimenko",email = "MikhailGerasimenko@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "opentelemetry-distro (>=0.48b0,<1.0.0)",
    "opentelemetry-exporter-otlp (>=1.28.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.48b0,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "isort (>=7.0.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=5.0.0,<6.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[[tool.poetry.source]]
name = "corporate"
url = "https://repo.severstal.severstalgroup.com/artifactory/api/pypi/pypi/simple"
priority = "primary"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
known_first_party = ["app"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true

[tool.black]
line-length = 79
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]