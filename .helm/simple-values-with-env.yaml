fullnameOverride: "$CI_PROJECT_NAME_SLUG"

global:
  image:
    repository: docker.repo.severstal.severstalgroup.com/$CI_PROJECT_PATH
    tag: 1.13

secrets:
  # Нужен для CronJob парсера: DATABASE_URL + OPENROUTER/EMBEDDING_* из Vault
  enabled: true
  projectNamespace: "$CI_PROJECT_NAMESPACE"
  backend: "eso-vault-backend"

deployment:
  replicas: 1
  reloadOnChange:
    enabled: true
  env:
    - name: HTTP_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: HTTPS_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: PARSING_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: NO_PROXY
      value: "localhost,127.0.0.1,.severstal.severstalgroup.com,.severstalgroup.com"
    - name: TZ
      value: "Europe/Moscow"
    # RAG через DATABASE_URL (Vault). QDRANT_URL не задаём.
  resources:
    limits:
      memory: 2Gi
      cpu: 2
    requests:
      memory: 512Mi
      cpu: 0.25

service:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

cronjob:
  enabled: true
  schedule: "30 0 * * *"
  timeZone: "Europe/Moscow"
  command:
    - /app/scripts/daily-parse-incontainer.sh
  env:
    - name: TZ
      value: "Europe/Moscow"
    - name: NAV_TZ
      value: "Europe/Moscow"
    - name: SYNC_NEWS_TO_SERVER
      value: "false"
    - name: HTTP_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: HTTPS_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: PARSING_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: NO_PROXY
      value: "localhost,127.0.0.1,.severstal.severstalgroup.com,.severstalgroup.com,sso-id-test-int.severstal.com"
  resources:
    limits:
      memory: 2Gi
      cpu: 2
    requests:
      memory: 512Mi
      cpu: 0.25
  tolerations:
  - key: "client-cluster"
    operator: "equal"
    value: "sales-supply"
    effect: "NoSchedule"

ingress:
  -
    className: nginx
    hosts:
    - host: generic-app.severstal.com
      paths:
        - path: /
          port: 8000
      tls:
        common: true
