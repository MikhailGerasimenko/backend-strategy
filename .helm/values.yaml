# -- String to partially override fullname
nameOverride: ""

# -- String to fully override common.names.fullname
fullnameOverride: ""

env: dev

global:
  image:
    repository: docker.repo.severstal.severstalgroup.com/sales-and-supply/templates-sss-v3/python/fastapi-template
    tag: "1.0.0"

  # -- Container registry credentials
  imagePullSecrets: "container-registry"

  # -- Image pull policy
  imagePullPolicy: Always

secrets:
  # -- Use external secrets or not
  enabled: true

  # -- Kind of external secret backend
  kind: "ClusterSecretStore"

  # -- External secrets backend name
  backend: "eso-vault-backend"

  projectNamespace: "sales-and-supply/templates-sss-v3/python"

  refreshInterval: 30m

  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"

  # -- If `false`, disables providing secrets as env to provide only secrets as files
  env: true

  # -- If `true`, creates a common secret for multiple services usage. Vault path must be projectNamespace/common/env/$env
  common: ""

    # -- Additional annotations to common secret
    # annotations: {}
    #   "helm.sh/hook": pre-install
    #   "helm.sh/hook-weight": "-10"

  # -- Mount common secret as file into container
  commonFiles:
    # - name: krb5.conf
    #   path: /etc/krb5.conf
    # - name: configmap.yaml
    #   path: /etc/configmap.yaml

  # -- Mount secret as file into container
  files: {}
    # - name: krb5.conf
    #   path: /etc/krb5.conf
    # - name: configmap.yaml
    #   path: /etc/configmap.yaml

  # -- Platform-common secrets (OTEL/Jaeger)
  platformCommon:
    enabled: false
    path: ""
    refreshInterval: "5m"

  # -- Provide ssl certificate with key via ESO
  tls:
    enabled: false
    common: true
    # -- External secrets backend name for TLS
    backend: "eso-vault-backend"

deployment:

  # image:

  #   # -- Deployment container registry image path. Overwrites global.image.repository parameter
  #   repository: docker.repo.severstal.severstalgroup.com/nginx

  #   # -- Deployment container registry image tag. Overwrites global.image.tag parameter
  #   tag: 1.21

  # -- Deployment image pull policy. Overwrites global.imagepullpolicy
  imagePullPolicy: IfNotPresent

  # -- Number of replicas for deployment
  replicas: 1

  # -- Fixed Environment variable
  env:
    - name: HTTP_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: HTTPS_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: PARSING_PROXY
      value: "http://ar-proxy.severstal.severstalgroup.com:3128"
    - name: NO_PROXY
      value: "localhost,127.0.0.1,.severstal.severstalgroup.com,.severstalgroup.com"
    - name: TZ
      value: "Europe/Moscow"
    # Подставьте DNS сервиса Qdrant из проекта db (namespace/сервис)
    - name: QDRANT_URL
      value: "http://qdrant:6333"
    # OPENROUTER_API_KEY / AUTH_SECRET / QDRANT_API_KEY — через Vault secrets

  # -- Additional annotations for deployment
  annotations: {}
    # additional-annotation: value-of-additional-annotation

  reloadOnChange:
    # -- Reloads container if configMap or secret changed
    enabled: true

    # -- Reloads the deployment if the specified configmap or secret in the namespace is changed, even if they are not used by the deployment itself
    # configMapOnChange: configmap-1
    # secretOnChange: secret-1

  # -- Additional deployment labels
  additionalLabels: {}
    # additional-label: value-of-my-additional-label

  # -- Additional deployment pod labels
  podLabels: {}
  #   additional-pod-label: value-of-additional-pod-label

  strategy:

    # -- Deployment strategy type
    type: RollingUpdate
    # or
    # type: Recreate

    # -- If strategy.type is `RollingUpdate`
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  # -- Command to run in main container
  command: "" #['sh', '-c', 'binary_package']

  ports:
  - containerPort: 8000
    name: http
    protocol: TCP

  # -- Deployment host aliases
  hostAliases: []
  # - ip: "10.10.10.10"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.10.10.11"
  #   hostnames:
  #   - "google.ru"
  #   - "yandex.ru"

  # -- Deployment init containers
  initContainers: {}
  #   init-container:
  #     image: docker.repo.severstal.severstalgroup.com/devops-public/corp-images/ubuntu:22.04
  #     command: ['sh', '-c', 'whoami']
  #     resources: {}
  #     volumeMounts:
  #     - name: additional-configmap-file-1
  #       mountPath: /tmp/index.html
  #       subPath: index.html
  #     env:
  #     - name: ENV_VAR_NAME
  #       value: "value"
  #     securityContext:
  #       runAsUser: 1000

  resources:
    limits:
      memory: 2Gi
      cpu: 2
    requests:
      memory: 512Mi
      cpu: 0.25

  probes:
    livenessProbe:
      failureThreshold: 4
      httpGet:
        path: /api/v1/health
        port: 8000
        scheme: HTTP
      initialDelaySeconds: 20
      periodSeconds: 15
      successThreshold: 1
      timeoutSeconds: 5
    readinessProbe:
      failureThreshold: 2
      httpGet:
        path: /api/v1/health
        port: 8000
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 10
      successThreshold: 2
      timeoutSeconds: 5

  # -- Deployment security context
  securityContext: {}
  #   runAsUser: 10000
  #   runAsGroup: 10000
  #   fsGroup: 10000

  # -- Container securityu context
  containerSecurityContext: {}
  #   runAsUser: 10000
  #   runAsGroup: 10000

  tolerations:
    - key: client-cluster
      operator: Equal
      value: sales-supply
      effect: "NoSchedule"

  # -- Deployment node selector
  nodeSelector: {}
  #   kubernetes.io/hostname: k8s-test-int11

  # -- Deployment affinity
  affinity: {}
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/hostname
  #           operator: In
  #           values:
  #           - k8s-test-int12

  # -- Deployment additional env. Mount env of any configMap or secret wich were created manually
  additionalEnvFrom: {}
  #   configMap:
  #     - additional-configmap-1
  #     - additional-configmap-2
  #   secret:
  #     - additional-secret-1
  #     - additional-secret-2

  # -- Deployment additional mounts. Mount configMap or secret wich were created manually as file into container
  additionalMounts: {}
  #   configMap:
  #     - name: additional-configmap-file-1
  #       mountPath: /tmp/index.html
  #     - name: additional-configmap-file-2
  #       mountPath: /tmp/data/configmap.yaml
  #   secret:
  #     - name: additional-secret-file-1
  #       mountPath: /mnt/data/config.yaml

  # -- Deployment additional PVC. Mount PVC wich was created manually into container
  additionalPVC: []
  #   - name: additional-pvc
  #     mountPath: /mnt/mydata

  # -- Default duration in seconds Kubernetes waits for container to exit before sending kill signal
  terminationGracePeriodSeconds: 60

service:

  # -- Service type
  type: ClusterIP

  # -- Additional annotation
  annotations: {}
    # my-service-annotation: my-service-annotation-value

  # -- Additional service labels
  additionalLabels: {}
  #   additional-label: value-additional-label

  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

ingress:
  enabled: false
  tlsEnabled: false
  className: nginx
  annotations: {}
  host: fastapi-template-dev.kube.severstal.severstalgroup.com
  paths:
    - path: /
      serviceName: fastapi-template
      port: 8000
  tls:
    secretName: fastapi-template

