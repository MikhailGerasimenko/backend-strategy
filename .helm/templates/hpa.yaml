{{- if and .Values.autoscaling .Values.autoscaling.hpa .Values.autoscaling.hpa.enabled }}
  {{- $hpa := .Values.autoscaling.hpa }}
  {{- $fullName := include "fullname" . -}}
  {{- $tr := (default (dict) $hpa.targetRef) -}}
---
  {{- if .Capabilities.APIVersions.Has "autoscaling/v2/HorizontalPodAutoscaler" }}
apiVersion: autoscaling/v2
  {{- else }}
apiVersion: autoscaling/v2beta2
  {{- end }}
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "labels" . | nindent 4 }}
  {{- with $hpa.additionalLabels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $hpa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: {{ default "apps/v1" (get $tr "apiVersion") }}
    kind:       {{ default "Deployment" (get $tr "kind") }}
    name:       {{ default $fullName     (get $tr "name") }}
  {{- with $hpa.minReplicas }}
  minReplicas: {{ . }}
  {{- end }}
  maxReplicas: {{ required "autoscaling.hpa.maxReplicas is required" $hpa.maxReplicas }}
  {{- if $hpa.metrics }}
  metrics:
    {{- toYaml $hpa.metrics | nindent 4 }}
  {{- end }}
  {{- if and (.Capabilities.APIVersions.Has "autoscaling/v2/HorizontalPodAutoscaler") $hpa.behavior }}
  behavior:
    {{- toYaml $hpa.behavior | nindent 4 }}
  {{- end }}
  {{- end }}
